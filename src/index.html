<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
  <!-- <style>
    * {
        border: 1px solid red;
    }
  </style> -->
</head>
<body class="py-6 px-16 font-sans bg-slate-100"> 
    <header class="flex justify-center p-2">
        <h1 class="text-4xl font-sans font-semibold">💸Finance Goals Pockets</h1>
    </header>   
    <main class="m-6">
        <section>
            <div class="card-tambah-goals p-8 bg-white/90 backdrop-blur-md shadow-md border-olive-500 rounded-2xl ">
                <h2 class="text-gray-500 font-bold mb-6 text-lg tracking-wide">🎯 Tambah Goals Baru</h2>
                <form action="" class="lg:flex flex-wrap items-end gap-4 justify-between grid grid-cols-1 md:grid-cols-2">
                    <div class="flex flex-col gap-2 flex-1">
                        <label for="" class="">Keterangan</label>
                        <input type="text" id="keterangan" placeholder="Masukkan Goals" class=" bg-white border-2 border-neutral-400 rounded-lg py-2 px-4 ">
                    </div>
                    <div class="flex flex-col gap-2 flex-1">
                        <label for="">Nominal (Rp)</label>
                        <input type="int" id="nominal" placeholder="50000" class="bg-white border-2 border-neutral-400 rounded-lg py-2 px-4 ">
                    </div>
                    <div class="flex flex-col gap-2 flex-1">
                        <label for="">Tanggal</label>
                        <input type="date" id="date" class="bg-white border-2 border-neutral-400 rounded-lg  py-2 px-4 ">
                    </div>
                    <div class="flex flex-col gap-2 flex-1">
                        <label for="">Kategori</label>
                        <select id="kategori" class="bg-white border-2 border-neutral-400 rounded-lg  py-2 px-4 ">
                            <option value="" disabled selected>Pilih salah satu</option>
                            <option value="Needs">Needs</option>
                            <option value="Wants">Wants</option>
                        </select>
                    </div>     
                    <button class="md:col-span-2 w-full lg:w-auto lg:px-6 py-2 border-2 bg-gray-800 hover:bg-gray-950 text-amber-50 rounded-lg font-medium">Tambah</button>  
                </form>
            </div>
        </section>
        <section>
            <div class="card-tambah-goals p-8 bg-white/80 backdrop-blur-md shadow-md border-olive-500 rounded-2xl my-10">
                 <h2 class="text-gray-500 font-bold mb-6 text-lg tracking-wide">🎯 Daftar Goals</h2>
            </div>
        </section>
    </main>
</body>
</html>
