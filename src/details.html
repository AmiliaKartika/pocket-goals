<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Halaman Details</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="./output.css" rel="stylesheet">
    </head>
    <body class="font-outfit bg-neutral-100">
        <div class="max-w-6xl mx-auto px-6 py-6 flex flex-col gap-5">
            <header class="flex py-4"> 
                <div class="flex items-center gap-3">
                    <h2 class="text-4xl font-sans font-semibold" id="goalTitle">Keterangan</h2>
                    <div class="inline-flex items-center py-1 px-2 bg-gray-200 rounded-full">
                        <p id="dueDate" class="text-xs font-semibold"></p>
                    </div>
                </div>
                
            </header>
            <main  class="flex flex-col gap-6">
                <section class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <div class="p-6 border border-neutral-200 bg-gradient-to-r from-white via-white to-blue-50 p-8 shadow-sm rounded-[20px] flex flex-col min-w-0 flex-1 gap-3">
                        <h3 class="text-gray-500 font-bold text-lg tracking-wide">Target</h3>
                        <p class="text-4xl font-bold text-gray-900" id="targetAmount">Rp 0</p>
                    </div>

                    <div class="border border-neutral-200 bg-white p-8 shadow-sm rounded-[20px] flex flex-col min-w-0 flex-1 gap-3">
                        <h3 class="text-gray-500 font-bold text-lg tracking-wide">Saat Ini</h3>
                        <p class="text-4xl font-bold text-gray-900" id="targetTerpenuhi">Rp 0</p>
                    </div>

                    <div class="border border-neutral-200 bg-white p-8 shadow-sm rounded-[20px] flex flex-col min-w-0 flex-1 gap-3">
                        <h3 class="text-gray-500 font-bold text-lg tracking-wide">Harus Cari</h3>
                        <p class="text-4xl font-bold text-gray-900" id="sisaTarget">Rp 0</p>
                    </div>

                </section>
                <section>
                    <div class="goal-form-section__card bg-white/90 backdrop-blur-md border-neutral-200 shadow-sm rounded-2xl flex-col min-w-0 p-6">
                        <form id="transactionForm" class="lg:flex flex-wrap items-end gap-4 justify-between grid grid-cols-1 md:grid-cols-2">
                            <div class="flex flex-col gap-2 flex-1">
                                <label for="transactionKeteranganInput">Keterangan</label>
                                <input type="text" id="detailsTitleInput" placeholder="Masukkan Goals" class=" bg-white border-2 border-neutral-400 rounded-lg py-2 px-4 ">
                            </div>
                            <div class="flex flex-col gap-2 flex-1">
                                <label for="transactionNominalInput">Nominal (Rp)</label>
                                <input type="int" id="detailsNominalInput" placeholder="50000" class="bg-white border-2 border-neutral-400 rounded-lg py-2 px-4 ">
                            </div>
                            <div class="flex flex-col gap-2 flex-1">
                                <label for="transactionDateInput">Tanggal</label>
                                <input type="date" id="detailsDateInput" class="bg-white border-2 border-neutral-400 rounded-lg  py-2 px-4 ">
                            </div>
                            <button id="button-form"  class="md:col-span-2 w-full lg:w-auto lg:px-6 py-2 border-2 bg-gray-800 hover:bg-gray-950 text-amber-50 rounded-lg font-medium">Tambah</button>  
                        </form>
                    </div>
                </section>
                <section>
                    <div class="goal-form-section__card bg-white/90 backdrop-blur-md border-neutral-200 shadow-sm rounded-2xl flex-col min-w-0 p-6">
                        <table class="w-full">
                            <thead class="bg-slate-50 border-b border-gray-300">
                                <tr>
                                    <th class="px-6 py-4 text-left">Keterangan</th>
                                    <th class="px-6 py-4 text-center">Nominal</th>
                                    <th class="px-6 py-4 text-center">Tanggal</th>
                                    <th class="px-6 py-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="transactionsList" class="divide-y divide-gray-200">
                                
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
        <script src="details.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </body>
</html>
